<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Linux Terminal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e11;color:#d1d5db;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.terminal{width:min(100%,1000px);height:min(92vh,760px);min-height:520px;margin:4vh auto;border:1px solid #30363d;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#0b0e11;box-shadow:0 18px 60px #0008}
.topbar,.statusbar{background:#171b20;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar{border-bottom:1px solid #30363d}
.dots{display:flex;gap:7px;align-items:center}.dot{width:11px;height:11px;border-radius:50%}
.red{background:#ff5f57}.yellow-dot{background:#febc2e}.green-dot{background:#28c840}
.title{font-size:12px;color:#9ca3af;margin-left:8px}
.output{flex:1;overflow:auto;padding:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.inputbar{padding:12px 14px;border-top:1px solid #30363d;display:flex;gap:10px;align-items:center;background:#101419}
.prompt{color:#4ade80;font-size:13px}.command{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#86efac;font:inherit;font-size:14px;caret-color:#4ade80}
.statusbar{font-size:10px;color:#6b7280}
.green{color:#4ade80}.blue{color:#60a5fa}.yellow{color:#facc15}.danger{color:#f87171}
.output::-webkit-scrollbar{width:6px}.output::-webkit-scrollbar-thumb{background:#39414b;border-radius:8px}
@media(max-width:650px){.terminal{margin:0;width:100%;height:100vh;min-height:100vh;border-radius:0}.output{font-size:12px}}
</style>
</head>
<body>
<main class="terminal">
  <header class="topbar">
    <div class="dots"><span class="dot red"></span><span class="dot yellow-dot"></span><span class="dot green-dot"></span><span class="title">kali@kali: ~</span></div>
    <span class="title">bash</span>
  </header>
  <section id="output" class="output" aria-live="polite"><span class="green">┌──(kali㉿kali)-[~]
└─$ </span></section>
  <form id="command-form" class="inputbar">
    <span class="prompt">❯</span>
    <input id="command" class="command" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus aria-label="Terminal command">
    <span class="title">ENTER</span>
  </form>
  <footer class="statusbar"><span>127.0.0.1 · LOCAL LAB</span><span>SIMULATED SHELL</span></footer>
</main>
<script>
(() => {
 const output=document.getElementById('output');
 const input=document.getElementById('command');
 const form=document.getElementById('command-form');
 let history=[],historyIndex=0;
 const green=s=>`<span class="green">${s}</span>`;
 const blue=s=>`<span class="blue">${s}</span>`;
 const yellow=s=>`<span class="yellow">${s}</span>`;
 const red=s=>`<span class="danger">${s}</span>`;
 const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const prompt=()=>green('┌──(kali㉿kali)-[~]<br>└─$ ');
 const results={
  'ip addr':()=>`${blue('1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536')}<br>    inet 127.0.0.1/8 scope host lo<br>    inet6 ::1/128 scope host<br><br>${blue('2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500')}<br>    inet 192.168.1.105/24 brd 192.168.1.255 scope global eth0<br>    inet6 fe80::216:3eff:fe11:2233/64 scope link`,
  'ip a':()=>results['ip addr'](),
  'ifconfig':()=>`lo: flags=73<UP,LOOPBACK,RUNNING><br>        inet 127.0.0.1  netmask 255.0.0.0<br>eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST><br>        inet 192.168.1.105  netmask 255.255.255.0`,
  'pwd':()=>'/home/kali','whoami':()=>'kali','hostname':()=>'kali',
  'date':()=> 'Wed Nov 18 14:00:00 IST 2026',
  'uname -a':()=>'Linux kali 6.12.0-kali-amd64 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux',
  'ls':()=>`<span class="blue">Desktop/  Documents/  Downloads/  Music/  Pictures/  Public/  Templates/  Videos/</span>`,
  'ls -la':()=>`total 32<br>drwxr-xr-x  8 kali kali 4096 Nov 18 14:00 .<br>drwxr-xr-x  3 root root 4096 Nov 18 10:00 ..<br>-rw-r--r--  1 kali kali  220 .bash_logout<br>-rw-r--r--  1 kali kali 3771 .bashrc<br>drwxr-xr-x  2 kali kali 4096 Documents`,
  'nmap 127.0.0.1':()=>`${yellow('Starting Nmap 7.95 ( https://nmap.org )')}<br>Nmap scan report for localhost (127.0.0.1)<br>Host is up (0.00012s latency).<br><br>PORT     STATE  SERVICE<br>22/tcp   closed ssh<br>80/tcp   closed http<br>3000/tcp open   ppp<br><br>Nmap done: 1 IP address (1 host up) scanned in 0.08 seconds`,
  'nmap -sV 127.0.0.1':()=>`${yellow('Starting Nmap 7.95')}<br>Nmap scan report for localhost (127.0.0.1)<br>Host is up (0.00010s latency).<br><br>PORT     STATE  SERVICE VERSION<br>22/tcp   closed ssh<br>80/tcp   closed http<br>3000/tcp open   http    Node.js Express framework<br><br>Service detection performed.<br>Nmap done: 1 IP address scanned in 1.21 seconds`,
  'nmap -sC -sV 127.0.0.1':()=>`${yellow('Starting Nmap 7.95')}<br>Nmap scan report for localhost (127.0.0.1)<br>Host is up (0.00011s latency).<br><br>PORT     STATE  SERVICE VERSION<br>22/tcp   closed ssh<br>80/tcp   closed http<br>3000/tcp open   http    Node.js Express framework<br>|_http-title: OWASP Juice Shop<br>|_http-server-header: Express<br><br>Nmap done: 1 IP address scanned in 2.43 seconds`,
  'nmap -sV -p 3000 127.0.0.1':()=>`PORT     STATE SERVICE VERSION<br>3000/tcp open  http    Node.js Express framework<br><br>Service Info: Application: OWASP Juice Shop`,
  'nikto -h http://127.0.0.1:3000':()=>`${yellow('- Nikto v2.5.0')}<br>---------------------------------------------------------------------------<br>+ Target IP:          127.0.0.1<br>+ Target Hostname:    localhost<br>+ Target Port:        3000<br>+ Start Time:         2026-11-18 14:00:00<br>---------------------------------------------------------------------------<br>+ Server: Express<br>+ /: The X-Content-Type-Options header is not set.<br>+ /: The X-Frame-Options header is not set.<br>+ /: Server information exposed in response headers.<br>+ 3 potential issues identified.<br>---------------------------------------------------------------------------<br>+ 1 host(s) tested`,
  'zap':()=>`${yellow('[ OWASP ZAP - SIMULATED ACTIVE SCAN ]')}<br>Target: http://127.0.0.1:3000<br>Spider: Complete<br>Passive scan: Complete<br>Active scan: Complete<br><br>${red('[HIGH]')} Cross-Site Scripting (XSS)<br>${red('[HIGH]')} SQL Injection (example finding)<br>${yellow('[MEDIUM]')} Missing security headers<br>${yellow('[MEDIUM]')} Content Security Policy not set<br>${blue('[INFO]')} Server information disclosure<br><br>Alerts: 5 | High: 2 | Medium: 2 | Informational: 1`,
  'help':()=>`Available simulated commands:<br>ip addr | ifconfig | pwd | whoami | hostname | date | uname -a<br>ls | ls -la | clear<br>nmap 127.0.0.1<br>nmap -sV 127.0.0.1<br>nmap -sC -sV 127.0.0.1<br>nmap -sV -p 3000 127.0.0.1<br>nikto -h http://127.0.0.1:3000<br>zap`
 };
 function print(command,result=''){
  output.insertAdjacentHTML('beforeend',prompt()+`<span>${escapeHTML(command)}</span><br>${result}<br>`);
  output.scrollTop=output.scrollHeight;
 }
 function run(raw){
  const cmd=raw.trim();if(!cmd)return;
  history.push(cmd);historyIndex=history.length;
  const key=cmd.toLowerCase().replace(/\s+/g,' ');
  if(key==='clear'){output.innerHTML='';return;}
  if(results[key]){print(cmd,results[key]());return;}
  if(/^(sudo|rm|shutdown|reboot|format|del|erase|curl|wget|ssh|nc|netcat|python|powershell|cmd|bash|exec|nmap|nikto|zap|apt|pip|npm|git)\b/.test(key)){
   print(cmd,red('bash: simulated command blocked or unsupported'));return;
  }
  print(cmd,red('bash: '+escapeHTML(cmd.split(/\s+/)[0])+': command not found'));
 }
 form.addEventListener('submit',e=>{e.preventDefault();const value=input.value;input.value='';run(value);});
 input.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){e.preventDefault();if(historyIndex>0){historyIndex--;input.value=history[historyIndex];}}
  if(e.key==='ArrowDown'){e.preventDefault();if(historyIndex<history.length-1){historyIndex++;input.value=history[historyIndex];}else{historyIndex=history.length;input.value='';}}
 });
 document.querySelector('.terminal').addEventListener('click',()=>input.focus());
})();
</script>
</body>
</html>
