<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Offline Kali Linux terminal simulation for Experiment No. 6: Penetration Testing Using Kali Linux.">
<title>Kali Linux Terminal · Exp 6</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0e11;--panel:#171b20;--panel2:#101419;--line:#30363d;
  --text:#d1d5db;--dim:#6b7280;--green:#4ade80;--blue:#60a5fa;
  --yellow:#facc15;--red:#f87171;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.terminal{width:min(100%,1000px);height:min(92vh,760px);min-height:520px;margin:4vh auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 18px 60px #0008}
.topbar,.statusbar{background:var(--panel);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar{border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%}
.red{background:#ff5f57}.yellow-dot{background:#febc2e}.green-dot{background:#28c840}
.title{font-size:12px;color:#9ca3af;margin-left:8px}
.output{flex:1;overflow:auto;padding:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:#39414b transparent}
.output:focus-visible{outline:1px solid #4ade8066;outline-offset:-2px}
.output::-webkit-scrollbar{width:6px}
.output::-webkit-scrollbar-thumb{background:#39414b;border-radius:8px}
.inputbar{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel2)}
.prompt{color:var(--green);font-size:13px}
.command{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#86efac;font:inherit;font-size:15px;caret-color:var(--green)}
.cmd{color:#e5e7eb}
.statusbar{font-size:10px;color:var(--dim)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.yellow{color:var(--yellow)}
.danger{color:var(--red)}
.dim{color:var(--dim)}
@media(max-width:650px){
  .terminal{margin:0;width:100%;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;border:0;border-radius:0}
  .output{font-size:12px}
  .command{font-size:16px}
}
</style>
</head>
<body>
<main class="terminal">
  <header class="topbar">
    <div class="dots"><span class="dot red"></span><span class="dot yellow-dot"></span><span class="dot green-dot"></span><span class="title">kali@kali: ~</span></div>
    <span class="title">bash</span>
  </header>
  <section id="output" class="output" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></section>
  <form id="command-form" class="inputbar">
    <span class="prompt" aria-hidden="true">❯</span>
    <input id="command" class="command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus aria-label="Terminal command">
    <span class="title" aria-hidden="true">ENTER</span>
  </form>
  <footer class="statusbar"><span>127.0.0.1 · LOCAL LAB</span><span>EXP 6 · SIMULATED SHELL</span></footer>
</main>
<script>
(() => {
  'use strict';

  const output = document.getElementById('output');
  const input = document.getElementById('command');
  const form = document.getElementById('command-form');

  const green = s => `<span class="green">${s}</span>`;
  const blue = s => `<span class="blue">${s}</span>`;
  const yellow = s => `<span class="yellow">${s}</span>`;
  const red = s => `<span class="danger">${s}</span>`;
  const dim = s => `<span class="dim">${s}</span>`;
  const lines = (...rows) => rows.join('<br>');
  const escapeHTML = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const promptHTML = () => `${green('┌──(kali㉿kali)-[~]')}<br>${green('└─$ ')}`;
  const pad = n => String(n).padStart(2, '0');

  const dateString = () => {
    const d = new Date();
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${d.getFullYear()}`;
  };

  const stamp = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  const bannerHTML = lines(
    green('Kali GNU/Linux 2026 (simulated)'),
    yellow('Exp No: 6 - Penetration Testing Using Kali Linux'),
    dim('Local target: http://127.0.0.1:3000 (OWASP Juice Shop)'),
    '',
    `Type ${blue('help')} for the lab commands or ${blue('report')} for the final result.`,
    ''
  );

  const commands = {
    'ip addr': () => lines(
      blue('1: lo: &lt;LOOPBACK,UP,LOWER_UP&gt; mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000'),
      '    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00',
      '    inet 127.0.0.1/8 scope host lo',
      '       valid_lft forever preferred_lft forever',
      '    inet6 ::1/128 scope host',
      '       valid_lft forever preferred_lft forever',
      blue('2: eth0: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc fq_codel state UP group default qlen 1000'),
      '    link/ether 00:16:3e:11:22:33 brd ff:ff:ff:ff:ff:ff',
      '    inet 192.168.1.105/24 brd 192.168.1.255 scope global dynamic eth0',
      '       valid_lft 86342sec preferred_lft 86342sec',
      '    inet6 fe80::216:3eff:fe11:2233/64 scope link',
      '       valid_lft forever preferred_lft forever'
    ),

    'ifconfig': () => lines(
      blue('eth0: flags=4163&lt;UP,BROADCAST,RUNNING,MULTICAST&gt;  mtu 1500'),
      '        inet 192.168.1.105  netmask 255.255.255.0  broadcast 192.168.1.255',
      '        ether 00:16:3e:11:22:33  txqueuelen 1000  (Ethernet)',
      '',
      blue('lo: flags=73&lt;UP,LOOPBACK,RUNNING&gt;  mtu 65536'),
      '        inet 127.0.0.1  netmask 255.0.0.0',
      '        inet6 ::1  prefixlen 128  scopeid 0x10&lt;host&gt;'
    ),

    'pwd': () => '/home/kali',
    'whoami': () => 'kali',
    'hostname': () => 'kali',
    'date': () => dateString(),
    'uname -a': () => 'Linux kali 6.12.0-kali-amd64 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux',

    'ls': () => blue('Desktop/  Documents/  Downloads/  juice-shop/  Music/  Pictures/  Public/  Templates/  Videos/'),

    'ls -la': () => lines(
      'total 44',
      'drwxr-xr-x 10 kali kali 4096 Nov 18 14:00 .',
      'drwxr-xr-x  3 root root 4096 Nov 18 10:00 ..',
      '-rw-r--r--  1 kali kali  220 Nov 18 10:00 .bash_logout',
      '-rw-r--r--  1 kali kali 3771 Nov 18 10:00 .bashrc',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Desktop',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Documents',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Downloads',
      blue('drwxr-xr-x 12 kali kali 4096 Nov 18 14:00 juice-shop'),
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Music',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Pictures',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Public',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Templates',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Videos'
    ),

    'nmap 127.0.0.1': () => lines(
      yellow('Starting Nmap 7.95 ( https://nmap.org )'),
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00012s latency).',
      '',
      'PORT     STATE  SERVICE',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   ppp',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 0.08 seconds'
    ),

    'nmap -sv 127.0.0.1': () => lines(
      yellow('Starting Nmap 7.95 ( https://nmap.org )'),
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00010s latency).',
      '',
      'PORT     STATE  SERVICE VERSION',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   http    Node.js Express framework',
      '',
      'Service detection performed. Please report any incorrect results at https://nmap.org/submit/ .',
      'Nmap done: 1 IP address (1 host up) scanned in 1.21 seconds'
    ),

    'nmap -sc -sv 127.0.0.1': () => lines(
      yellow('Starting Nmap 7.95 ( https://nmap.org )'),
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00011s latency).',
      '',
      'PORT     STATE  SERVICE VERSION',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   http    Node.js Express framework',
      '|_http-title: OWASP Juice Shop',
      '|_http-server-header: Express',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 2.43 seconds'
    ),

    'nmap -sv -p 3000 127.0.0.1': () => lines(
      yellow('Starting Nmap 7.95 ( https://nmap.org )'),
      '',
      'PORT     STATE SERVICE VERSION',
      '3000/tcp open  http    Node.js Express framework',
      'Service Info: Application: OWASP Juice Shop',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 0.42 seconds'
    ),

    'nikto -h http://127.0.0.1:3000': () => lines(
      yellow('- Nikto v2.5.0'),
      '---------------------------------------------------------------------------',
      '+ Target IP:          127.0.0.1',
      '+ Target Hostname:    localhost',
      '+ Target Port:        3000',
      `+ Start Time:         ${stamp()}`,
      '---------------------------------------------------------------------------',
      '+ Server: Express',
      '+ /: The X-Content-Type-Options header is not set.',
      '+ /: The X-Frame-Options header is not set.',
      '+ /: Content-Security-Policy header is not set.',
      '+ /: Server information exposed in response headers.',
      '+ 4 potential issues identified.',
      '---------------------------------------------------------------------------',
      '+ 1 host(s) tested'
    ),

    'zap': () => lines(
      yellow('[ OWASP ZAP 2.15.0 - SIMULATED ACTIVE SCAN ]'),
      'Target: http://127.0.0.1:3000',
      'Spider: Complete (24 URLs)',
      'Passive scan: Complete',
      'Active scan: Complete',
      '',
      `${red('[HIGH]  ')} Cross-Site Scripting (XSS)`,
      `${red('[HIGH]  ')} SQL Injection (example finding)`,
      `${yellow('[MEDIUM]')} Missing security headers`,
      `${yellow('[MEDIUM]')} Content Security Policy not set`,
      `${blue('[INFO]  ')} Server information disclosure`,
      '',
      'Alerts: 5 | High: 2 | Medium: 2 | Informational: 1',
      dim("Run 'report' to generate the experiment result.")
    ),

    'report': () => lines(
      yellow('PENETRATION TESTING REPORT'),
      dim('========================================'),
      'Target : 127.0.0.1 (localhost)',
      'App    : OWASP Juice Shop - http://127.0.0.1:3000',
      '',
      yellow('Findings'),
      `${red('[HIGH]  ')} Cross-Site Scripting (XSS)`,
      `${red('[HIGH]  ')} SQL Injection`,
      `${yellow('[MEDIUM]')} Missing security headers (X-Content-Type-Options, X-Frame-Options)`,
      `${yellow('[MEDIUM]')} Content-Security-Policy not set`,
      `${blue('[INFO]  ')} Server information disclosure`,
      '',
      yellow('Recommended fixes'),
      '1. Validate and encode user input; enforce a strict CSP.',
      '2. Use parameterized queries instead of string-built SQL.',
      '3. Send X-Content-Type-Options: nosniff and X-Frame-Options: DENY.',
      '4. Remove Express / X-Powered-By version headers.',
      '5. Patch dependencies and repeat the scans regularly.',
      '',
      green('RESULT'),
      'Penetration testing was performed using Kali Linux tools, and the',
      'security status of the local practice application was assessed.'
    ),

    'help': () => lines(
      yellow('Exp No: 6 - Penetration Testing Using Kali Linux'),
      dim('Simulated lab workflow (no real commands are executed)'),
      '',
      `${green('1.')}  ip addr`,
      `${green('2.')}  nmap 127.0.0.1`,
      `${green('3.')}  nmap -sV 127.0.0.1`,
      `${green('4.')}  nmap -sC -sV 127.0.0.1`,
      `${green('5.')}  nikto -h http://127.0.0.1:3000`,
      `${green('6.')}  zap`,
      `${green('7.')}  report`,
      '',
      dim('Other: pwd | whoami | hostname | date | uname -a | ls | ls -la | clear'),
      dim('Up/Down arrows browse command history.')
    )
  };

  commands['ip a'] = commands['ip addr'];

  const history = [];
  let historyIndex = 0;

  const resetOutput = () => {
    output.innerHTML = bannerHTML;
    output.scrollTop = 0;
  };

  const print = (command, result = '') => {
    output.insertAdjacentHTML('beforeend', `${promptHTML()}<span class="cmd">${escapeHTML(command)}</span><br>${result}<br>`);
    output.scrollTop = output.scrollHeight;
  };

  const blocked = /^(sudo|su|rm|rmdir|mv|dd|shutdown|reboot|poweroff|mkfs|format|del|erase|curl|wget|ssh|scp|nc|netcat|python|python3|perl|ruby|powershell|cmd|bash|sh|exec|eval|apt|apt-get|pip|pip3|npm|git)\b/;
  const labTools = /^(nmap|nikto|zap|sqlmap|john|hydra|msfconsole|metasploit)\b/;

  const run = raw => {
    const cmd = raw.replace(/\s+/g, ' ').trim();
    if (!cmd) return;

    history.push(cmd);
    historyIndex = history.length;

    const key = cmd.toLowerCase();

    if (key === 'clear') {
      resetOutput();
      return;
    }

    if (Object.prototype.hasOwnProperty.call(commands, key) && typeof commands[key] === 'function') {
      print(cmd, commands[key]());
      return;
    }

    const first = escapeHTML(cmd.split(' ')[0]);

    if (blocked.test(key)) {
      print(cmd, red(`bash: ${first}: disabled in this safe offline demo`));
      return;
    }

    if (labTools.test(key)) {
      print(cmd, red(`bash: ${first}: only the lab commands in 'help' are simulated`) + '<br>' + dim('No host is contacted and no scan is performed.'));
      return;
    }

    print(cmd, red(`bash: ${first}: command not found`) + '<br>' + dim("Type 'help' to list the supported lab commands."));
  };

  form.addEventListener('submit', event => {
    event.preventDefault();
    const value = input.value;
    input.value = '';
    run(value);
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        input.value = history[historyIndex];
      }
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex++;
        input.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        input.value = '';
      }
    } else if (event.key === 'l' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      resetOutput();
    }
  });

  document.querySelector('.terminal').addEventListener('click', () => {
    if (window.getSelection().toString()) return;
    input.focus();
  });

  resetOutput();
})();
</script>
</body>
</html>
