<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>kali@kali: ~</title>
<style>
*{box-sizing:border-box}
:root{--term-bg:#0c0c0c;--term-fg:#d8d8d8;--prompt-green:#4ade80;--prompt-blue:#6aa8ff;--dim:#8b949e;--blue:#5b9dff;--yellow:#e3b341;--red:#ff6b6b}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#05060a;color:var(--term-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.desktop{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.panel{position:relative;z-index:10;flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(#151820,#0d1015);border-bottom:1px solid #000;color:#cdd3dc;font-size:12.5px;line-height:1;user-select:none}
.panel-left,.panel-right{display:flex;align-items:center;gap:4px;min-width:0}
.panel-logo{width:20px;height:20px;display:block;margin-right:2px;flex:0 0 20px}
.panel-item{padding:5px 8px;border-radius:3px;white-space:nowrap}
.panel-item:hover{background:#ffffff14}
.panel-menu{font-weight:600;color:#fff}
.workspaces{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.ws{min-width:20px;height:20px;display:grid;place-items:center;border-radius:3px;color:#8d96a3;font-size:11px}
.ws.active{background:#ffffff14;color:#fff}
.panel-clock{padding:5px 8px;color:#e2e6ec;font-variant-numeric:tabular-nums;white-space:nowrap}
.workspace{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1100px 680px at 78% 16%,rgba(38,99,235,.30),transparent 62%),radial-gradient(900px 680px at 12% 88%,rgba(96,53,225,.20),transparent 60%),linear-gradient(155deg,#070b15 0%,#0b1224 48%,#07080d 100%)}
.wallpaper-logo{position:absolute;right:-5%;bottom:-16%;width:min(64vw,760px);height:auto;opacity:.10;pointer-events:none;filter:drop-shadow(0 0 90px rgba(59,130,246,.45))}
.window{position:relative;z-index:2;width:min(100%,1120px);height:min(100%,780px);min-height:0;display:flex;flex-direction:column;background:var(--term-bg);border:1px solid #000;box-shadow:0 25px 80px #000c,0 0 0 1px #ffffff0b;overflow:hidden}
.titlebar{flex:0 0 32px;height:32px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#2b3039,#20242b);border-bottom:1px solid #0a0c0f;color:#e3e7ed;font-size:12.5px;line-height:1;user-select:none}
.title-left{display:flex;align-items:center;gap:8px;min-width:0;padding-left:10px}
.window-icon{width:16px;height:16px;flex:0 0 16px;display:block}
.window-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.window-controls{display:flex;align-self:stretch}
.wc{width:40px;display:grid;place-items:center;color:#cbd2dc;font-size:14px;line-height:1}
.wc:hover{background:#ffffff14}
.wc.close:hover{background:#d64545;color:#fff}
.menubar{flex:0 0 26px;height:26px;display:flex;align-items:center;gap:1px;padding:0 6px;background:#1a1e24;border-bottom:1px solid #0e1014;color:#cbd2dc;font-size:12.5px;line-height:1;user-select:none}
.menu-item{padding:5px 8px;border-radius:3px}
.menu-item:hover{background:#ffffff12;color:#fff}
.tabbar{flex:0 0 30px;height:30px;display:flex;align-items:flex-end;gap:4px;background:#12151a;border-bottom:1px solid #000;padding:0 6px;font-size:12px;line-height:1;user-select:none}
.tab{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;background:#0c0c0c;color:#dfe4ea;border:1px solid #2b3038;border-bottom:0;border-radius:4px 4px 0 0}
.tab-close{color:#8d96a3;font-size:15px;line-height:1}
.tab-new{align-self:center;color:#8d96a3;font-size:16px;margin-left:4px}
.screen{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 18px;background:var(--term-bg);color:var(--term-fg);font-family:"DejaVu Sans Mono","Liberation Mono","Noto Sans Mono",Consolas,monospace;font-size:14px;line-height:1.5;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:#3b414a transparent;cursor:text}
.screen::-webkit-scrollbar{width:10px}
.screen::-webkit-scrollbar-track{background:transparent}
.screen::-webkit-scrollbar-thumb{background:#3b414a;border:2px solid #0c0c0c;border-radius:6px}
.output{white-space:pre-wrap;overflow-wrap:anywhere}
.p-top,.p-bottom{color:var(--prompt-green)}
.p-user,.p-dir{color:var(--prompt-blue)}
.promptline{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-items:baseline;white-space:pre;margin:0;padding:0}
.promptline .p-top{grid-column:1/-1;grid-row:1}
.promptline .p-bottom{grid-column:1;grid-row:2}
.promptline .command{grid-column:2;grid-row:2}
.command{width:100%;min-width:0;padding:0 0 0 .6ch;margin:0;border:0;outline:0;background:transparent;color:#f0f0f0;font:inherit;line-height:inherit;caret-color:#f0f0f0}
.cmd{color:#f0f0f0}
.green{color:var(--prompt-green)}
.blue{color:var(--blue)}
.yellow{color:var(--yellow)}
.danger{color:var(--red)}
.dim{color:var(--dim)}
@media(max-width:700px){
  .panel,.wallpaper-logo,.menubar,.tabbar{display:none}
  .workspace{padding:0;background:#000}
  .window{width:100%;height:100dvh;max-height:none;border:0;box-shadow:none}
  .titlebar{flex-basis:29px;height:29px}
  .screen{padding:8px 8px 14px;font-size:13px}
  .command{font-size:16px}
  .wc{width:34px}
}
</style>
</head>

        <div id="output" class="output" role="log" aria-live="polite"></div>
        <form id="command-form" class="promptline">
          <span class="p-top" aria-hidden="true">┌──(<span class="p-user">kali㉿kali</span>)-[<span class="p-dir">~</span>]</span><span class="p-bottom" aria-hidden="true">└─$</span><input id="command" class="command" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus aria-label="Terminal command">
        </form>
      </section>
    </main>
  </div>
</div>
<script>
(() => {
  'use strict';

  const screen = document.getElementById('screen');
  const output = document.getElementById('output');
  const input = document.getElementById('command');
  const form = document.getElementById('command-form');
  const clockEl = document.getElementById('panel-clock');

  const green = s => `<span class="green">${s}</span>`;
  const blue = s => `<span class="blue">${s}</span>`;
  const yellow = s => `<span class="yellow">${s}</span>`;
  const red = s => `<span class="danger">${s}</span>`;
  const dim = s => `<span class="dim">${s}</span>`;
  const lines = (...rows) => rows.join('<br>');
  const escapeHTML = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const dateString = () => {
    const d = new Date();
    return `${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} IST ${d.getFullYear()}`;
  };

  const stamp = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  const promptTop = `<span class="p-top">┌──(<span class="p-user">kali㉿kali</span>)-[<span class="p-dir">~</span>]</span>`;
  const promptEcho = command => `${promptTop}<br><span class="p-bottom">└─$</span> <span class="cmd">${escapeHTML(command)}</span>`;

  const commands = {
    'ip addr': () => lines(
      blue('1: lo: &lt;LOOPBACK,UP,LOWER_UP&gt; mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000'),
      '    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00',
      '    inet 127.0.0.1/8 scope host lo',
      '       valid_lft forever preferred_lft forever',
      '    inet6 ::1/128 scope host',
      '       valid_lft forever preferred_lft forever',
      blue('2: eth0: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc fq_codel state UP group default qlen 1000'),
      '    link/ether 00:16:3e:11:22:33 brd ff:ff:ff:ff:ff:ff',
      '    inet 192.168.1.105/24 brd 192.168.1.255 scope global dynamic eth0',
      '       valid_lft 86342sec preferred_lft 86342sec',
      '    inet6 fe80::216:3eff:fe11:2233/64 scope link',
      '       valid_lft forever preferred_lft forever'
    ),

    'ifconfig': () => lines(
      blue('eth0: flags=4163&lt;UP,BROADCAST,RUNNING,MULTICAST&gt;  mtu 1500'),
      '        inet 192.168.1.105  netmask 255.255.255.0  broadcast 192.168.1.255',
      '        ether 00:16:3e:11:22:33  txqueuelen 1000  (Ethernet)',
      '',
      blue('lo: flags=73&lt;UP,LOOPBACK,RUNNING&gt;  mtu 65536'),
      '        inet 127.0.0.1  netmask 255.0.0.0',
      '        inet6 ::1  prefixlen 128  scopeid 0x10&lt;host&gt;'
    ),

    'pwd': () => '/home/kali',
    'whoami': () => 'kali',
    'hostname': () => 'kali',
    'date': () => dateString(),
    'uname -a': () => 'Linux kali 6.12.0-kali-amd64 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux',

    'ls': () => blue('Desktop/  Documents/  Downloads/  juice-shop/  Music/  Pictures/  Public/  Templates/  Videos/'),

    'ls -la': () => lines(
      'total 44',
      'drwxr-xr-x 10 kali kali 4096 Nov 18 14:00 .',
      'drwxr-xr-x  3 root root 4096 Nov 18 10:00 ..',
      '-rw-r--r--  1 kali kali  220 Nov 18 10:00 .bash_logout',
      '-rw-r--r--  1 kali kali 3771 Nov 18 10:00 .bashrc',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Desktop',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Documents',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Downloads',
      blue('drwxr-xr-x 12 kali kali 4096 Nov 18 14:00 juice-shop'),
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Music',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Pictures',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Public',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Templates',
      'drwxr-xr-x  2 kali kali 4096 Nov 18 10:00 Videos'
    ),

    'nmap 127.0.0.1': () => lines(
      'Starting Nmap 7.95 ( https://nmap.org )',
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00012s latency).',
      '',
      'PORT     STATE  SERVICE',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   ppp',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 0.08 seconds'
    ),

    'nmap -sV 127.0.0.1': () => lines(
      'Starting Nmap 7.95 ( https://nmap.org )',
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00010s latency).',
      '',
      'PORT     STATE  SERVICE VERSION',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   http    Node.js Express framework',
      '',
      'Service detection performed. Please report any incorrect results at https://nmap.org/submit/ .',
      'Nmap done: 1 IP address (1 host up) scanned in 1.21 seconds'
    ),

    'nmap -sC -sV 127.0.0.1': () => lines(
      'Starting Nmap 7.95 ( https://nmap.org )',
      'Nmap scan report for localhost (127.0.0.1)',
      'Host is up (0.00011s latency).',
      '',
      'PORT     STATE  SERVICE VERSION',
      '22/tcp   closed ssh',
      '80/tcp   closed http',
      '3000/tcp open   http    Node.js Express framework',
      '|_http-title: OWASP Juice Shop',
      '|_http-server-header: Express',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 2.43 seconds'
    ),

    'nmap -sV -p 3000 127.0.0.1': () => lines(
      'Starting Nmap 7.95 ( https://nmap.org )',
      '',
      'PORT     STATE SERVICE VERSION',
      '3000/tcp open  http    Node.js Express framework',
      'Service Info: Application: OWASP Juice Shop',
      '',
      'Nmap done: 1 IP address (1 host up) scanned in 0.42 seconds'
    ),

    'nikto -h http://127.0.0.1:3000': () => lines(
      '- Nikto v2.5.0',
      '---------------------------------------------------------------------------',
      '+ Target IP:          127.0.0.1',
      '+ Target Hostname:    localhost',
      '+ Target Port:        3000',
      `+ Start Time:         ${stamp()}`,
      '---------------------------------------------------------------------------',
      '+ Server: Express',
      '+ /: The X-Content-Type-Options header is not set.',
      '+ /: The X-Frame-Options header is not set.',
      '+ /: Content-Security-Policy header is not set.',
      '+ /: Server information exposed in response headers.',
      '+ 4 potential issues identified.',
      '---------------------------------------------------------------------------',
      '+ 1 host(s) tested'
    ),

    'zap': () => lines(
      yellow('OWASP ZAP 2.15.0 - Active Scan'),
      'Target: http://127.0.0.1:3000',
      'Spider: Complete (24 URLs)',
      'Passive scan: Complete',
      'Active scan: Complete',
      '',
      `${red('[HIGH]  ')} Cross-Site Scripting (XSS)`,
      `${red('[HIGH]  ')} SQL Injection`,
      `${yellow('[MEDIUM]')} Missing security headers`,
      `${yellow('[MEDIUM]')} Content Security Policy not set`,
      `${blue('[INFO]  ')} Server information disclosure`,
      '',
      'Alerts: 5 | High: 2 | Medium: 2 | Informational: 1'
    ),

    'report': () => lines(
      yellow('PENETRATION TESTING REPORT'),
      dim('========================================'),
      'Target : 127.0.0.1 (localhost)',
      'App    : OWASP Juice Shop - http://127.0.0.1:3000',
      '',
      yellow('Findings'),
      `${red('[HIGH]  ')} Cross-Site Scripting (XSS)`,
      `${red('[HIGH]  ')} SQL Injection`,
      `${yellow('[MEDIUM]')} Missing security headers (X-Content-Type-Options, X-Frame-Options)`,
      `${yellow('[MEDIUM]')} Content Security Policy not set`,
      `${blue('[INFO]  ')} Server information disclosure`,
      '',
      yellow('Recommended fixes'),
      '1. Validate and encode user input; enforce a strict CSP.',
      '2. Use parameterized queries instead of string-built SQL.',
      '3. Send X-Content-Type-Options: nosniff and X-Frame-Options: DENY.',
      '4. Remove Express / X-Powered-By version headers.',
      '5. Patch dependencies and repeat the scans regularly.',
      '',
      green('RESULT'),
      'Penetration testing was performed using Kali Linux tools, and the',
      'security status of the local practice application was assessed.'
    ),

    'help': () => lines(
      green('Available commands'),
      '',
      '  1. ip addr',
      '  2. nmap 127.0.0.1',
      '  3. nmap -sV 127.0.0.1',
      '  4. nmap -sC -sV 127.0.0.1',
      '  5. nikto -h http://127.0.0.1:3000',
      '  6. zap',
      '  7. report',
      '',
      dim('Other: ip a | ifconfig | pwd | whoami | hostname | date | uname -a | ls | ls -la | clear'),
      dim('History: Up/Down arrows')
    )
  };

  commands['ip a'] = commands['ip addr'];

  const history = [];
  let historyIndex = 0;

  const scrollBottom = () => { screen.scrollTop = screen.scrollHeight; };

  const resetScreen = () => {
    output.innerHTML = '';
    screen.scrollTop = 0;
  };

  const print = (command, result = '') => {
    output.insertAdjacentHTML('beforeend', `${promptEcho(command)}<br>${result}<br>`);
    scrollBottom();
  };

  const setInput = value => {
    input.value = value;
    input.setSelectionRange(value.length, value.length);
  };

  const run = raw => {
    const command = raw.trim();
    if (!command) return;
    const key = command.replace(/\s+/g, ' ');

    history.push(command);
    historyIndex = history.length;

    if (key === 'clear') {
      resetScreen();
      return;
    }

    if (Object.prototype.hasOwnProperty.call(commands, key) && typeof commands[key] === 'function') {
      print(command, commands[key]());
      return;
    }

    print(command, `zsh: command not found: ${escapeHTML(command.split(/\s+/)[0])}`);
  };

  const submitCommand = () => {
    const value = input.value;
    input.value = '';
    if (!value.trim()) {
      output.insertAdjacentHTML('beforeend', `${promptEcho('')}<br>`);
      scrollBottom();
      return;
    }
    run(value);
  };

  form.addEventListener('submit', event => {
    event.preventDefault();
    submitCommand();
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      submitCommand();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        setInput(history[historyIndex]);
      }
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex++;
        setInput(history[historyIndex]);
      } else {
        historyIndex = history.length;
        setInput('');
      }
    } else if (event.key.toLowerCase() === 'l' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      resetScreen();
    }
  });

  screen.addEventListener('click', () => {
    if (window.getSelection().toString()) return;
    input.focus();
    scrollBottom();
  });

  const updateClock = () => {
    const d = new Date();
    clockEl.textContent = `${DAYS[d.getDay()]} ${pad(d.getDate())} ${MONTHS[d.getMonth()]}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  updateClock();
  setInterval(updateClock, 30000);
  input.focus({ preventScroll: true });
})();
</script>
</body>
</html>
